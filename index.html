<!doctype html>
<html lang="en" data-theme="smoked">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <!-- Theme, PRE-PAINT: the stored material or smoked (the default), applied
       before any stylesheet paints so the app never flashes the other theme.
       Mirrors src/lib/theme.js, which cannot run this early; theme.test.js
       pins the key/default/values contract the two share. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('try:theme'); } catch (e) { }
      if (t !== 'moulded' && t !== 'smoked') t = 'smoked';
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'moulded') {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#0e1217');
      }
    })();
  </script>
  <title>Try — Triathlon Training</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Try" />
</head>
<body>
  <div id="root"></div>
  <!-- Vite entry: bundles React + the app, transpiles JSX, injects PWA manifest + SW. -->
  <script type="module" src="/src/app/main.jsx"></script>
</body>
</html>
